name: Translate content (es + ar)

# On-demand machine translation of the next wave of site text into Spanish and Arabic with the Anthropic API.
# It runs scripts/translate-content.mjs, rebuilds the overlays, and opens a pull request. It never merges.
# The owner must add the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Target languages (comma-separated: es, ar)'
        type: string
        default: 'es,ar'
      limit:
        description: 'Maximum new strings per language this run'
        type: string
        default: '120'
      model:
        description: 'Claude model id'
        type: string
        default: 'claude-sonnet-5-5'

permissions:
  contents: read

concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    name: Translate and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate translations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANG_INPUT: ${{ inputs.lang }}
          LIMIT_INPUT: ${{ inputs.limit }}
          MODEL_INPUT: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret."
            exit 1
          fi
          node scripts/translate-content.mjs --provider anthropic --lang "$LANG_INPUT" --limit "$LIMIT_INPUT" --model "$MODEL_INPUT" --tag "run-${GITHUB_RUN_ID}"
      - name: Validate and rebuild the overlays
        run: |
          node scripts/build-i18n.mjs
          npm test
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          paths="i18n/es.json i18n/ar.json i18n/coverage.json dist/js/content.es.js dist/js/content.ar.js"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "No new translations to commit."
            exit 0
          fi
          branch="machine-translations/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- $paths
          git commit -m "i18n: machine-translated content (pending native review)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${branch}"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "i18n: machine-translated content (es + ar)" \
            --body "Generated by the Translate content workflow. Every string is machine-translated and needs a native speaker's review before the banner can be removed. The glossary in dist/js/i18n.js fixed the legal, tax and verification terms. The validator passed."
