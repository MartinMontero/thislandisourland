name: no-model-calls

# Fails if the project could send text to a hosted model or translation service, or run on a paid runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-model-calls:
    name: no-model-calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/no-model-calls-check.mjs
